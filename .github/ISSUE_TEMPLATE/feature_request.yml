name: Feature request
description: Something Zinc could do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation you're in and what gets in the way. This matters more than the solution, because there may be a better one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Zinc to do
      description: How you picture it working. If another terminal does it well, say which one and how.
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Working on it
      options:
        - label: I'd like to build this myself, once it's agreed.
