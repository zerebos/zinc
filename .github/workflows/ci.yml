name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or pull request replaces a run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The native DLLs, then a build and test of each architecture (build.yml).
  build:
    uses: ./.github/workflows/build.yml
