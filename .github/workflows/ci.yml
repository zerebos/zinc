name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7
        with:
          # The build works out Zinc's version from the commit history and tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The native DLLs (libghostty-vt, the sprite rasterizer, the shader translator) change only when the scripts,
      # the patches or the native sources do, so they're built once per such change and kept.
      - name: Restore the native DLLs
        id: native
        uses: actions/cache/restore@v6
        with:
          path: native
          key: native-x64-${{ hashFiles('scripts/build/**', 'patches/ghostty/**', 'native-src/**') }}

      # setup-zig downloads Zig from the community mirrors (because ziglang.org asks CI to) and checks its signature.
      # It's pinned to the commit of v2.2.1 with its own cache off, because the DLLs are cached above.
      - name: Install Zig
        if: steps.native.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
          use-cache: false

      - name: Build the native DLLs
        if: steps.native.outputs.cache-hit != 'true'
        run: pwsh scripts/build/libghostty.ps1

      # Saved here, not at the end of the job, so a failing build or test doesn't throw away the DLLs just built.
      - name: Keep the native DLLs
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native
          key: ${{ steps.native.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build Zinc.slnx --no-incremental -warnaserror

      # The file-based scripts use Zinc.Core, so a change there can break them.
      # They're built with TreatWarningsAsErrors, because a file-based build refuses -warnaserror.
      - name: Build the scripts
        run: |
          dotnet build scripts/dev/vt-bench.cs -p:TreatWarningsAsErrors=true
          dotnet build scripts/dev/export-reference.cs -p:TreatWarningsAsErrors=true
          dotnet build scripts/release/release-notes.cs -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test
