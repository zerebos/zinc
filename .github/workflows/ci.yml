name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7
        with:
          # The build works out Zinc's version from the commit history and tags.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Builds the native DLLs, or restores them from the cache.
      - uses: ./.github/actions/native-dlls

      - name: Build
        run: dotnet build Zinc.slnx --no-incremental -warnaserror

      # The file-based scripts use Zinc.Core, so a change there can break them.
      # They're built with TreatWarningsAsErrors, because a file-based build refuses -warnaserror.
      - name: Build the scripts
        run: |
          dotnet build scripts/dev/vt-bench.cs -p:TreatWarningsAsErrors=true
          dotnet build scripts/dev/export-reference.cs -p:TreatWarningsAsErrors=true
          dotnet build scripts/release/release-notes.cs -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test
